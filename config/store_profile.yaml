# Source: Day-2 Plan §D Decision 29 -- store baseline grounding chain.
# aov_minor and orders_per_month are cited to source documents directly
# (Impl Plan v2.1 §Day 2 Step 2). decline_rate/foreign_bin_share/cgnat_share
# are Day-2 authored parameters (Impl Plan v2.1 §Day 2) that shape the
# empirical baseline model (packages/simulator/baseline.py). Unlike
# config/attack_tiers.yaml, no acceptance test enforces a {value,unit,
# source} shape here -- this file follows config/rules.yaml's flat,
# commented convention instead.
#
# All share/rate fields are integers in parts-per-mille (per Decision 30's
# "no floats" discipline, applied here too for consistency even though it
# is only load-bearing for the serialized event stream).

aov_minor: 120000                 # Eval Protocol v2 §1.3 -- average order value, Rs 1,200
orders_per_month: 5000            # PRD v2 §3 -- baseline volume, ~5,000 orders/month (business-metric
                                   # context for aov_minor; not the generator's rate driver -- see below)
baseline_attempts_per_hour: 72    # PRD v2 §3 -- "~0.02 attempts/second" baseline scoring rate
                                   # (0.02 * 3600 = 72; scored attempts run ahead of completed orders,
                                   # e.g. abandoned/declined checkouts, so this exceeds orders_per_month's
                                   # implied ~7/hour -- the generator's rate driver is this field, integer,
                                   # not orders_per_month, to avoid a float division at generation time)
currency: INR                     # PRD v2 §3 -- INR-denominated storefront
timezone: Asia/Kolkata            # Backend Schema v2 §1 -- merchant.timezone default

decline_rate_per_mille: 60        # Impl Plan v2.1 §Day 2 -- ~6% organic decline rate;
                                   # code drawn from Schema v2 §3.2's closed 9-value vocabulary
foreign_bin_share_per_mille: 120  # Threat Model v2 §7b -- non-zero foreign share so it is not
                                   # a free attack discriminator (Day-2 Plan §F anti-leakage checklist)
cgnat_share_per_mille: 30         # Threat Model v2 §7b -- fraction of baseline customers sharing
                                   # a CGNAT-assigned IP with other customers
