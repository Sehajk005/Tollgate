# Source: Day-2 Plan §F "Attack model" -- parameter set drawn verbatim from
# Eval Protocol v2 §5's declared search space (pacing, IP pool size, BIN
# spread, amount sampler, session reuse, hour-of-day placement), not
# invented. Every populated leaf is {value, unit, source}; `source` is
# checked by tests/acceptance/test_attack_tiers.py::TestA10 for length,
# banned vocabulary, and citation shape (Decision 38).
#
# Day 2 ships easy + hard (Day-2 Plan §C, C3). medium/evasive exist as
# declared placeholders -- `pending` leaves are exempt from A10's source
# check (Step 2 failure-mode note) but must be present so the tier selector
# has all four keys to show, two enabled (Decision 36).

