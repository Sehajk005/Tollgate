[project]
name = "tollgate"
version = "0.1.0"
description = "Tollgate -- pre-authorization card-testing defence (Day 1 walking skeleton)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Source: Day-3 Plan Step 0 -- RedisWindowStore backend + differential
    # tests need a real client; pandas moves here too since
    # tests/oracles/pandas_windows.py (test-only, Decision -- never a data
    # path) needs it and dev is the extras group the test suite runs under.
    "redis>=5.0",
    "pandas>=2.2",
    # Source: Day-5 Plan Step 0 -- the Layer-1 detector and its acceptance
    # tests need lightgbm + numpy; in dev so the suite can run. No
    # scikit-learn, no imblearn (test_no_smote.py enforces this).
    "lightgbm>=4.5",
    "numpy>=1.26",
]
# Source: Day-5 Plan Step 0 -- LightGBM is specified (Impl Plan Day 5, TRD
# §6.9 and stack table). It stays out of the base install so the rules-only
# fallback (services/scorer with no models/ artifact) runs without a
# compiled dependency. eval/ never imports lightgbm -- only
# packages/detect/model.py and scripts/train_l1.py do.
model = [
    "lightgbm>=4.5",
    "numpy>=1.26",
]
# Source: Day-2 Plan Step 3 -- dev-only, used exactly once by
# scripts/distill_baseline.py to produce the committed derived profile.
# Never imported by packages/simulator at runtime (Decision 29: "Runtime
# simulator is stdlib + pyyaml only"; enforced by tests/acceptance/
# test_simulator_safety.py's import-closure scan).
data = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
markers = [
    "characterization: change-detector tests, never acceptance gates (Impl Plan v2.1 §1.2)",
    "slow: exercises a real subprocess (durability / lock-contention tests)",
    "safety: simulator import-closure / network-egress safety tests (Day 2 §I)",
    "redis: requires a reachable Redis (TOLLGATE_REDIS_URL); skips otherwise (Day-3 Plan §5)",
    "metamorphic: Layer-2 metamorphic relations M1-M8 (Day-6 Plan §4 / Impl Plan §5)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "services*", "scripts*", "eval*"]
