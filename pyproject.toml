[project]
name = "tollgate"
version = "0.1.0"
description = "Tollgate -- pre-authorization card-testing defence (Day 1 walking skeleton)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Source: Day-2 Plan Step 3 -- dev-only, used exactly once by
# scripts/distill_baseline.py to produce the committed derived profile.
# Never imported by packages/simulator at runtime (Decision 29: "Runtime
# simulator is stdlib + pyyaml only"; enforced by tests/acceptance/
# test_simulator_safety.py's import-closure scan).
data = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
markers = [
    "characterization: change-detector tests, never acceptance gates (Impl Plan v2.1 §1.2)",
    "slow: exercises a real subprocess (durability / lock-contention tests)",
    "safety: simulator import-closure / network-egress safety tests (Day 2 §I)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "services*", "scripts*"]
